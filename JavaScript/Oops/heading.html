<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Item List...!</h2>

    <ul> 
        <li id="item-1">Item 1 <button onclick="hello(1);">Delete</button></li> <br>
        <li id="item-2">Item 2 <button onclick="hello(2);">Delete</button></li> <br>
        <li id="item-3">Item 3 <button onclick="hello(3);">Delete</button></li> <br>
        <li id="item-4">Item 4 <button onclick="hello(4);">Delete</button></li> <br>
    </ul>

    <script>
        function hello(itemId) {
            var result = confirm("Are you sure you want to delete this item?");

            if (result) {
                alert("Item deleted successfully.");
                var listItem = document.getElementById("item-" + itemId);  
                // Example: removing item-2

                if(listItem){
                    listItem.remove();
                }
            } else {
                alert("This  action cannot performed (deletion canceled).");
            }
        } 
    </script>
  </body>
</html>
