<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning DOM</title>
  </head>
  <body>
    <form>
      <input type="text" id="myName" placeholder="Enter Your Name" /> <br />
      <input type="button" name="myButton" value="Click Me" onclick="hello()" />
    </form>
    
    <script>
      function hello() {
        var a = document.getElementById("myName").value;
        alert("!!...Welcome... anmoL " + a);
      }
    </script>
  </body>
</html>
