<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set TimeOut Promise</title>
  </head>
  <body>
    <script>
      console.log("Start");

      setTimeout(() => {
        console.log("Timeout");
      }, 0);

      Promise.resolve().then(() => {
        console.log("Promise");
      });

      console.log("End");
    </script>
  </body>
</html>

<!--  Start → Call Stack
 
setTimeout → Web API → Task Queue

Promise.then → Microtask Queue

End → Call Stack empty

Microtask runs first → Promise

Then Macrotask → setTimeout  -->
