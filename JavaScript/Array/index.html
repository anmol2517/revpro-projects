<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Functions</title>
</head>
<body>
    <script>
        let student = {
            fname : "Anmol",
            lname : "Kumar",
            skills : ["HTML", "CSS", "Javascript", "ReactJS"],
        }
        document.write("First Name : "+ student.fname + "<br>");
        document.write("Last Name : "+ student.lname + "<br>");
        document.write("My Skills : "+ student.skills + "<br>");
    </script>
</body>
</html>
