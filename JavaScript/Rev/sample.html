<!DOCTYPE html>
<html>
<head>
    <title>Array Sum Min Max</title>
</head>
<body>

<h2>Enter numbers</h2>

<input type="text" id="numbers" placeholder="10,20,30,40">
<br><br>

<button onclick="calculate()">Calculate</button>

<h3 id="result"></h3>

<script>
    function calculate() {
        
        let input = document.getElementById("numbers").value;

       
        let arr = input.split(",").map(Number);

        
        let sum = 0;
        let min = arr[0];
        let max = arr[0];

        for (let i = 0; i < arr.length; i++) {
            sum += arr[i];

            if (arr[i] < min) {
                min = arr[i];
            }

            if (arr[i] > max) {
                max = arr[i];
            }
        }

        
        document.getElementById("result").innerHTML =
            "Array: " + arr + "<br>" +
            "Sum: " + sum + "<br>" +
            "Minimum: " + min + "<br>" +
            "Maximum: " + max;
    }
</script>

</body>
</html>
