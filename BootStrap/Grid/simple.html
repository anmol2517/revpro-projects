<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap 12 Columns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
  <div class="row">
    <div class="col-1 bg-primary text-white text-center">1</div>
    <div class="col-1 bg-secondary text-white text-center">2</div>
    <div class="col-1 bg-success text-white text-center">3</div>
    <div class="col-1 bg-danger text-white text-center">4</div>
    <div class="col-1 bg-warning text-dark text-center">5</div>
    <div class="col-1 bg-info text-dark text-center">6</div>
    <div class="col-1 bg-light text-dark text-center border">7</div>
    <div class="col-1 bg-dark text-white text-center">8</div>
    <div class="col-1 bg-primary text-white text-center">9</div>
    <div class="col-1 bg-secondary text-white text-center">10</div>
    <div class="col-1 bg-success text-white text-center">11</div>
    <div class="col-1 bg-danger text-white text-center">12</div>
</div>

<div class="container">
  <div class="row">
    <div class="col-1 bg-primary text-white text-center">12</div>
    <div class="col-1 bg-secondary text-white text-center">11</div>
    <div class="col-1 bg-success text-white text-center">10</div>
    <div class="col-1 bg-danger text-white text-center">9</div>
    <div class="col-1 bg-warning text-dark text-center">8</div>
    <div class="col-1 bg-info text-dark text-center">7</div>
    <div class="col-1 bg-light text-dark text-center border">6</div>
    <div class="col-1 bg-dark text-white text-center">5</div>
    <div class="col-1 bg-primary text-white text-center">4</div>
    <div class="col-1 bg-secondary text-white text-center">3</div>
    <div class="col-1 bg-success text-white text-center">2</div>
    <div class="col-1 bg-danger text-white text-center">1</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
