<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form BootStrap - Tables</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-6">
          <form action="">
            <div class="mb-3">
              <label for="fname" class="form-label fw-bold">First Name</label>
              <input
                type="text"
                name="fname"
                id="fname"
                class="form-control"
                placeholder="Enter Your First Name"
                required
              />
            </div>
             <div class="mb-3">
              <label for="lname" class="form-label fw-bold">Last Name</label>
              <input
                type="text"
                name="lname"
                id="lname"
                class="form-control"
                placeholder="Enter Your Last Name"
                required
              />
              <div class="mb-3">
              <label for="email" class="form-label fw-bold">Email Id</label>
              <input
                type="email"
                name="email"
                id="email"
                class="form-control"
                placeholder="Enter Your Email Id"
                required
              />
            </div>
            </div>
             <div class="mb-3">
              <label for="uname" class="form-label fw-bold">User Name</label>
              <input
                type="text"
                name="uname"
                id="uname"
                class="form-control"
                placeholder="Enter Your User Name"
                required
              />
            </div>
             <div class="mb-3">
              <label for="pass" class="form-label fw-bold">Password </label>
              <input
                type="password"
                name="pass"
                id="pass"
                class="form-control"
                placeholder="Enter Your Password"
                required
              />
            </div>
            <div class="mb-3">
              <label for="resume" class="form-label fw-bold">Upload Resume</label>
              <input
                type="file"
                name="resume"
                id="resume"
                class="form-control"
                placeholder="Upload Your Resume"
                required
              />
            </div>
            <div class="mb-3">
                <label for="gender" class="gender fw-bold">Gender</label>
                <br>
                <input type="radio" name="gen" id="gender" class="form-check-input">
                <label for="gender" class="form-check-label">Male</label>
                <br>
                <input type="radio" name="gen" id="gender" class="form-check-input">
                <label for="gender" class="form-check-label">Female</label>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
