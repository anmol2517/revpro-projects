<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Servlets : Bootstrap Web</title>
</head>
<body>

<div class="container-fluid bg-dark text-light py-3">
    <header class="text-center">
        <h1 class="display-6">Signup here..</h1>
    </header>

    <section class="container mt-4">
        <form method="post" action="/Servlets/booturl">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="inputEmail" class="form-label">Email Id</label>
                    <input type="email" class="form-control" id="inputEmail" name="inputEmail" placeholder="Enter Your Email Address">
                </div>
                <div class="col-md-6">
                    <label for="inputPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="inputPassword" name="inputPassword" placeholder="Enter Your Password">
                </div>
            </div>

            <div class="mb-3">
                <label for="inputName" class="form-label">Enter Your Name</label>
                <input type="text" class="form-control" id="inputName" name="inputName" placeholder="Enter Your Full Name">
            </div>

            <div class="mb-3">
                <label for="inputAddress" class="form-label">Enter Complete Address</label>
                <input type="text" class="form-control" id="inputAddress" name="inputAddress" placeholder="Apartment or floor">
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="inputCity" class="form-label">City</label>
                    <input type="text" class="form-control" id="inputCity" name="inputCity" placeholder="Enter Your City">
                </div>
                <div class="col-md-4">
                    <label for="inputState" class="form-label">State</label>
                    <select id="inputState" name="inputState" class="form-select">
                        <option selected>Choose...</option>
                        <option>Jammu & Kashmir</option>
                        <option>Andaman Nicobar</option>
                        <option>Pathankot</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="inputZip" class="form-label">Zip</label>
                    <input type="text" class="form-control" id="inputZip" name="inputZip" placeholder="Enter Your Zip Code">
                </div>
            </div>

            <div class="mb-3 form-check">
                <input class="form-check-input" type="checkbox" id="gridCheck">
                <label class="form-check-label" for="gridCheck">
                    Check me out
                </label>
            </div>

            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
    </section>
</div>

</body>
</html>
