<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outline Border Shadow Text</title>
    <style>
        .container{
            border: 5px solid hotpink;
            margin: 50px; 
            width: 300px;
            height: 200px;
            box-shadow: 9px 25px 7px burlywood;
            background: antiquewhite;
        }
    </style>
  </head>
  <body>
    <div class="container">
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Facere, ut
        quasi aut a, placeat perspiciatis libero quas, alias sint unde
        asperiores voluptatibus quod odit consectetur. Aspernatur mollitia nemo
        deserunt eaque.
      </p>
    </div>
  </body>
</html>
