<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions Elements</title>
    <style>
        .container {
            border: 5px solid black;
            height: 3000px;
            background-color: lightgreen;
        }
        .div1{
            border: 2px solid red;
            width: 100px;
            height: 100px;
            margin: 30px;
            display: inline-block;
            text-align: center;
        }
        .div2{
            border: 2px solid red;
            width: 100px;
            height: 100px;
            margin: 30px;
            display: inline-block;
            text-align: center;
        }
        .div3{
            border: 2px solid red;
            width: 100px;
            height: 100px;
            margin: 30px;
            display: inline-block;
            text-align: center;
        }
        .div4{
            border: 2px solid red;
            width: 100px;
            height: 100px;
            margin: 30px;
            display: inline-block;
            text-align: center;
        }
        .div5{
            border: 2px solid red;
            width: 100px;
            height: 100px;
            margin: 30px;
            display: inline-block;
            text-align: center;
        }
        #div1{
            position: static;  /* Default position */
            top: 30px;
            left: 40px;
            background-color: peachpuff;
        }
        #div3{
            position: relative;  /* Positioned relative to its normal position */
            top: 40px;
            left: 40px;
            background-color: lightblue;
        }
        #div2{
            position: absolute; /* Positioned relative to the nearest positioned ancestor */
            top: 50px;
            left: 30px;
            background-color: yellow;
        }
        #div4{
            position: fixed;  /* Positioned relative to the viewport */
            right: 50px;
            background-color: plum;
        }
        #div5{
            position: sticky;  /* Positioned based on the user's scroll position */
            top: 60px;
            left: 20px;
            background-color: darkslateblue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="div1" id="div1">Div1</div>
        <div class="div2" id="div2">Div2</div>
        <div class="div3" id="div3">Div3</div>
        <div class="div4" id="div4">Div4</div>
        <div class="div5" id="div5">Div5</div>
    </div>
</body>
</html>
