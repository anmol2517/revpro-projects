<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greeting Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sky">
      <div class="pataka p1"></div>
      <div class="pataka p2"></div>
      <div class="pataka p3"></div>
    </div>

    <div class="card">
      <div class="card-inner">
        <div class="card-front">
          <div class="content">
            <h1>For You</h1>
            <div class="gift-icon">🎁</div> <br>
            <h3><p>tap this!</p></h3>
          </div>
        </div>
        <div class="card-back">
          <div class="content">
            <h2>Wishes!</h2>
            <hr />
            <p>
              Wishing you a New Year filled with love, light, and happiness. May
              every day shine brighter than the last!
            </p>
            <div class="heart">✨</div>
            <p class="signature">- anmoL</p>
            
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
